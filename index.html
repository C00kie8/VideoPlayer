
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>VISION PLAYER — Premium Video Experience</title>

<style>
:root {
  --red: #ff304f;
  --bg: #08090d;
  --glass: rgba(20,22,30,.76);
  --white: #fff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
}

body {
  min-height: 100vh;
  background: var(--bg);
  color: white;
  font-family: Inter, system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px;
  overflow-x: hidden;
}

/* AMBIENT BACKGROUND */

.ambient {
  position: fixed;
  inset: -20%;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  filter: blur(120px) saturate(200%);
  transform: scale(1.2);
  transition: opacity 1s;
  background: radial-gradient(
    ellipse,
    #373b66,
    transparent 65%
  );
}

.ambient.visible {
  opacity: .65;
}

.dark-overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    transparent 0%,
    rgba(0,0,0,.45) 70%,
    #000 120%
  );
}

/* PLAYER */

.player {
  width: 100%;
  max-width: 1250px;
  position: relative;
  z-index: 2;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  padding: 0 5px;
}

.logo {
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 3px;
}

.logo span {
  color: var(--red);
}

.status {
  color: #888;
  font-size: 12px;
  letter-spacing: 1px;
}

.stage {
  width: 100%;
  aspect-ratio: 16/9;
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  background: #000;
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 35px 100px rgba(0,0,0,.8);
  isolation: isolate;
  transition: box-shadow .5s;
}

.stage video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  background: #000;
}

#vrCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: none;
  z-index: 4;
  touch-action: none;
}

.stage.vr-mode #vrCanvas {
  display: block;
}

.stage.vr-mode video {
  visibility: hidden;
}

/* CENTER PLAY */

.center-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 5;
  pointer-events: none;
  transition: opacity .3s;
}

.center-overlay.hidden {
  opacity: 0;
}

.center-play {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.3);
  backdrop-filter: blur(20px);
  color: white;
  font-size: 32px;
  cursor: pointer;
  pointer-events: auto;
  transition: .25s;
}

.center-play:hover {
  background: var(--red);
  transform: scale(1.12);
  box-shadow: 0 0 45px rgba(255,48,79,.4);
}

/* CONTROLS */

.controls {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10;
  padding: 65px 22px 18px;
  background: linear-gradient(
    transparent,
    rgba(0,0,0,.78) 40%,
    rgba(0,0,0,.96)
  );
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}

.stage:hover .controls,
.controls.active,
.stage:focus-within .controls {
  opacity: 1;
  pointer-events: auto;
}

/* PROGRESS */

.progress-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.time {
  font-size: 12px;
  color: white;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.progress {
  flex: 1;
  height: 5px;
  position: relative;
  display: flex;
  align-items: center;
}

.progress input {
  width: 100%;
  appearance: none;
  height: 4px;
  border-radius: 20px;
  outline: none;
  cursor: pointer;
  background: linear-gradient(
    to right,
    var(--red) 0%,
    var(--red) 0%,
    rgba(255,255,255,.3) 0%
  );
}

.progress input::-webkit-slider-thumb {
  appearance: none;
  width: 13px;
  height: 13px;
  background: var(--red);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--red);
}

.progress input::-moz-range-thumb {
  width: 13px;
  height: 13px;
  background: var(--red);
  border: none;
  border-radius: 50%;
}

/* BUTTONS */

.button-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.group {
  display: flex;
  align-items: center;
  gap: 7px;
}

.btn {
  min-width: 40px;
  height: 40px;
  padding: 0 10px;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px;
  background: rgba(255,255,255,.07);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: .2s;
  backdrop-filter: blur(15px);
}

.btn svg {
  width: 19px;
  height: 19px;
  fill: currentColor;
}

.btn:hover {
  background: rgba(255,255,255,.2);
  border-color: rgba(255,255,255,.3);
  transform: translateY(-2px);
}

.btn:active {
  transform: scale(.94);
}

.btn.active {
  color: var(--red);
  background: rgba(255,48,79,.14);
  border-color: rgba(255,48,79,.5);
}

.btn.primary {
  background: var(--red);
  border-color: var(--red);
}

.btn.primary:hover {
  background: #ff526a;
  box-shadow: 0 0 20px rgba(255,48,79,.35);
}

.volume {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px;
}

.volume input {
  width: 75px;
  accent-color: var(--red);
  cursor: pointer;
}

select {
  height: 38px;
  background: rgba(255,255,255,.08);
  color: white;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  padding: 0 8px;
  outline: none;
  cursor: pointer;
}

select option {
  background: #151515;
}

/* VR BADGE */

.vr-badge {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 8;
  padding: 8px 13px;
  border-radius: 30px;
  background: rgba(255,48,79,.85);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  display: none;
}

.stage.vr-mode .vr-badge {
  display: block;
}

/* FILE INFO */

.file-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 17px 5px;
  color: #888;
  font-size: 13px;
  gap: 10px;
}

.file-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.upload {
  height: 42px;
  padding: 0 20px;
  border-radius: 12px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.13);
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  color: white;
  transition: .2s;
  white-space: nowrap;
}

.upload:hover {
  background: var(--red);
  border-color: var(--red);
}

#fileInput {
  display: none;
}

.hint {
  text-align: center;
  font-size: 11px;
  color: #555;
  margin-top: 12px;
}

/* MOBILE */

@media(max-width:700px) {
  body {
    padding: 12px 8px;
  }

  .stage {
    border-radius: 12px;
  }

  .controls {
    padding: 35px 9px 8px;
  }

  .button-row {
    gap: 4px;
  }

  .group {
    gap: 3px;
  }

  .btn {
    min-width: 32px;
    height: 33px;
    padding: 0 6px;
    border-radius: 9px;
  }

  .btn svg {
    width: 16px;
    height: 16px;
  }

  .volume {
    display: none;
  }

  .btn span {
    font-size: 10px;
  }

  .time {
    font-size: 10px;
  }

  .progress-row {
    gap: 7px;
    margin-bottom: 7px;
  }

  .center-play {
    width: 58px;
    height: 58px;
  }

  .logo {
    font-size: 15px;
  }

  .status {
    font-size: 9px;
  }

  .upload {
    height: 35px;
    padding: 0 11px;
    font-size: 11px;
  }

  .file-info {
    font-size: 11px;
  }

  select {
    height: 32px;
    font-size: 10px;
    max-width: 70px;
  }
}

@media(max-width:380px) {
  .right-group .btn {
    min-width: 29px;
  }
}
</style>
</head>

<body>

<div class="ambient" id="ambient"></div>
<div class="dark-overlay"></div>

<main class="player">

  <header class="topbar">
    <div class="logo">VISION<span>.</span>PLAYER</div>
    <div class="status">PREMIUM EXPERIENCE</div>
  </header>

  <section class="stage" id="stage">

    <video id="video" playsinline preload="metadata"></video>

    <canvas id="vrCanvas"></canvas>

    <div class="vr-badge">360° SPHERICAL MODE</div>

    <div class="center-overlay" id="centerOverlay">
      <button class="center-play" id="centerPlay">▶</button>
    </div>

    <div class="controls" id="controls">

      <div class="progress-row">
        <span class="time" id="time">0:00 / 0:00</span>

        <div class="progress">
          <input
            type="range"
            id="seek"
            min="0"
            max="100"
            value="0"
            step="0.01"
          >
        </div>
      </div>

      <div class="button-row">

        <div class="group">

          <button class="btn" id="playBtn" title="Play / Pause">
            <svg id="playIcon" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none">
              <path d="M6 5h4v14H6zm8 0h4v14h-4z"/>
            </svg>
          </button>

          <button class="btn" id="backBtn" title="Назад 5 секунд">
            ↶5
          </button>

          <button class="btn" id="nextBtn" title="Вперёд 5 секунд">
            5↷
          </button>

          <div class="volume">
            <span>♪</span>
            <input id="volume" type="range" min="0" max="1"
              step="0.01" value="1">
          </div>

        </div>

        <div class="group right-group">

          <button class="btn" id="loopBtn" title="Повтор видео">
            <svg viewBox="0 0 24 24">
              <path d="M17 2l4 4-4 4V7H7a3 3 0 0 0-3 3v2H2v-2a5 5 0 0 1 5-5h10V2zM7 22l-4-4 4-4v3h10a3 3 0 0 0 3-3v-2h2v2a5 5 0 0 1-5 5H7v3z"/>
            </svg>
          </button>

          <select id="speed" title="Скорость">
            <option value=".25">0.25×</option>
            <option value=".5">0.5×</option>
            <option value=".75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>

          <button class="btn" id="vrBtn" title="360° режим">
            360°
          </button>

          <button class="btn" id="webxrBtn" title="VR Headset">
            VR
          </button>

          <button class="btn" id="fullscreenBtn" title="Полный экран">
            ⛶
          </button>

        </div>
      </div>
    </div>

  </section>

  <div class="file-info">
    <div class="file-name" id="fileName">
      Видео не выбрано
    </div>

    <label class="upload" for="fileInput">
      ＋ Загрузить видео
    </label>

    <input type="file" id="fileInput" accept="video/*">
  </div>

  <div class="hint">
    SPACE — PLAY/PAUSE · ← → — SEEK · L — LOOP · F — FULLSCREEN · M — MUTE
  </div>

</main>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ==================================
   ELEMENTS
================================== */

const video = document.getElementById('video');
const stage = document.getElementById('stage');
const canvas = document.getElementById('vrCanvas');

const ambient = document.getElementById('ambient');

const controls = document.getElementById('controls');
const overlay = document.getElementById('centerOverlay');

const playBtn = document.getElementById('playBtn');
const centerPlay = document.getElementById('centerPlay');

const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');

const seek = document.getElementById('seek');
const time = document.getElementById('time');

const volume = document.getElementById('volume');
const speed = document.getElementById('speed');

const loopBtn = document.getElementById('loopBtn');
const vrBtn = document.getElementById('vrBtn');
const webxrBtn = document.getElementById('webxrBtn');

const fullscreenBtn = document.getElementById('fullscreenBtn');

const fileInput = document.getElementById('fileInput');
const fileName = document.getElementById('fileName');

/* ==================================
   STATE
================================== */

let objectURL = null;
let hideTimer = null;
let ambientFrame = null;
let lastAmbient = 0;

let vrActive = false;
let dragging = false;

let lon = 0;
let lat = 0;

let pointerX = 0;
let pointerY = 0;

/* ==================================
   TIME
================================== */

function formatTime(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) {
    return '0:00';
  }

  const h = Math.floor(seconds / 3600);
  const m = Math.floor(seconds % 3600 / 60);
  const s = Math.floor(seconds % 60);

  if (h > 0) {
    return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  return `${m}:${String(s).padStart(2,'0')}`;
}

function updateProgress() {
  const duration = video.duration;

  if (!Number.isFinite(duration) || duration <= 0) {
    time.textContent = '0:00 / 0:00';
    seek.value = 0;
    return;
  }

  const percent = video.currentTime / duration * 100;

  seek.value = percent;

  seek.style.background = `
    linear-gradient(
      to right,
      #ff304f ${percent}%,
      rgba(255,255,255,.3) ${percent}%
    )
  `;

  time.textContent =
    `${formatTime(video.currentTime)} / ${formatTime(duration)}`;
}

video.addEventListener('timeupdate', updateProgress);
video.addEventListener('loadedmetadata', updateProgress);
video.addEventListener('durationchange', updateProgress);

seek.addEventListener('input', () => {
  if (Number.isFinite(video.duration)) {
    video.currentTime = Number(seek.value) / 100 * video.duration;
  }
});

/* ==================================
   PLAY / PAUSE
================================== */

async function togglePlay() {
  if (!video.src) return;

  if (video.paused) {
    try {
      await video.play();
    } catch (error) {
      console.warn('Playback error:', error);
    }
  } else {
    video.pause();
  }
}

playBtn.addEventListener('click', togglePlay);
centerPlay.addEventListener('click', togglePlay);

video.addEventListener('click', () => {
  if (!vrActive) togglePlay();
});

video.addEventListener('play', () => {
  playIcon.style.display = 'none';
  pauseIcon.style.display = 'block';
  overlay.classList.add('hidden');
  startAmbient();
});

video.addEventListener('pause', () => {
  playIcon.style.display = 'block';
  pauseIcon.style.display = 'none';
  overlay.classList.remove('hidden');
  stopAmbient();
});

video.addEventListener('ended', () => {
  if (!video.loop) {
    overlay.classList.remove('hidden');
  }
});

/* ==================================
   LOOP
================================== */

loopBtn.addEventListener('click', () => {
  video.loop = !video.loop;

  loopBtn.classList.toggle('active', video.loop);

  loopBtn.title = video.loop
    ? 'Повтор включён'
    : 'Повтор выключен';
});

/* ==================================
   SEEK
================================== */

document.getElementById('backBtn').addEventListener('click', () => {
  if (Number.isFinite(video.duration)) {
    video.currentTime = Math.max(0, video.currentTime - 5);
  }
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (Number.isFinite(video.duration)) {
    video.currentTime = Math.min(
      video.duration,
      video.currentTime + 5
    );
  }
});

/* ==================================
   VOLUME
================================== */

volume.addEventListener('input', () => {
  video.volume = Number(volume.value);
  video.muted = video.volume === 0;
});

speed.addEventListener('change', () => {
  video.playbackRate = Number(speed.value);
});

/* ==================================
   FULLSCREEN
================================== */

fullscreenBtn.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) {
      await stage.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.warn('Fullscreen unavailable:', error);
  }
});

/* ==================================
   AMBIENT LIGHT
================================== */

const sampleCanvas = document.createElement('canvas');

sampleCanvas.width = 32;
sampleCanvas.height = 18;

const sampleCtx = sampleCanvas.getContext('2d', {
  willReadFrequently: true
});

function updateAmbient() {
  if (video.paused || !video.videoWidth) return;

  try {
    sampleCtx.drawImage(
      video,
      0, 0,
      sampleCanvas.width,
      sampleCanvas.height
    );

    const pixels = sampleCtx.getImageData(
      0, 0,
      sampleCanvas.width,
      sampleCanvas.height
    ).data;

    let r = 0;
    let g = 0;
    let b = 0;
    let count = 0;

    for (let i = 0; i < pixels.length; i += 16) {
      r += pixels[i];
      g += pixels[i + 1];
      b += pixels[i + 2];
      count++;
    }

    r = Math.round(r / count);
    g = Math.round(g / count);
    b = Math.round(b / count);

    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);

    const boost = 1.45;

    if (max > 0) {
      r = Math.min(255, Math.round((r - min) * boost + min));
      g = Math.min(255, Math.round((g - min) * boost + min));
      b = Math.min(255, Math.round((b - min) * boost + min));
    }

    ambient.style.background = `
      radial-gradient(
        ellipse at center,
        rgb(${r},${g},${b}) 0%,
        rgba(${r},${g},${b},.45) 35%,
        transparent 75%
      )
    `;

    stage.style.boxShadow = `
      0 35px 100px rgba(0,0,0,.8),
      0 0 65px rgba(${r},${g},${b},.2)
    `;

    ambient.classList.add('visible');

  } catch (error) {
    // Некоторые защищённые видеопотоки запрещают чтение кадров.
  }
}

function ambientLoop(now) {
  if (now - lastAmbient > 300) {
    updateAmbient();
    lastAmbient = now;
  }

  ambientFrame = requestAnimationFrame(ambientLoop);
}

function startAmbient() {
  if (ambientFrame !== null) return;
  ambientFrame = requestAnimationFrame(ambientLoop);
}

function stopAmbient() {
  if (ambientFrame !== null) {
    cancelAnimationFrame(ambientFrame);
    ambientFrame = null;
  }
}

/* ==================================
   360 SPHERICAL VIDEO
================================== */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  16 / 9,
  0.1,
  1100
);

camera.position.set(0, 0, 0.01);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  stage.clientWidth,
  stage.clientHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');

const geometry = new THREE.SphereGeometry(
  500,
  64,
  48
);

geometry.scale(-1, 1, 1);

const texture = new THREE.VideoTexture(video);

texture.colorSpace = THREE.SRGBColorSpace;

const material = new THREE.MeshBasicMaterial({
  map: texture
});

const sphere = new THREE.Mesh(geometry, material);

scene.add(sphere);

function resizeRenderer() {
  const width = stage.clientWidth;
  const height = stage.clientHeight;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);
}

const resizeObserver = new ResizeObserver(resizeRenderer);
resizeObserver.observe(stage);

/* CAMERA LOOK */

function updateCamera() {
  if (renderer.xr.isPresenting) return;

  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);

  camera.lookAt(
    500 * Math.sin(phi) * Math.cos(theta),
    500 * Math.cos(phi),
    500 * Math.sin(phi) * Math.sin(theta)
  );
}

/* RENDER LOOP */

renderer.setAnimationLoop(() => {
  if (!vrActive && !renderer.xr.isPresenting) return;

  updateCamera();

  renderer.render(scene, camera);
});

/* MOUSE / TOUCH */

canvas.addEventListener('pointerdown', event => {
  if (!vrActive || renderer.xr.isPresenting) return;

  dragging = true;

  pointerX = event.clientX;
  pointerY = event.clientY;

  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener('pointermove', event => {
  if (!dragging) return;

  lon -= (event.clientX - pointerX) * .15;
  lat += (event.clientY - pointerY) * .15;

  lat = Math.max(-85, Math.min(85, lat));

  pointerX = event.clientX;
  pointerY = event.clientY;
});

function stopDragging() {
  dragging = false;
}

canvas.addEventListener('pointerup', stopDragging);
canvas.addEventListener('pointercancel', stopDragging);

canvas.addEventListener('wheel', event => {
  if (!vrActive || renderer.xr.isPresenting) return;

  camera.fov += event.deltaY * .035;

  camera.fov = Math.max(35, Math.min(100, camera.fov));

  camera.updateProjectionMatrix();
});

/* ==================================
   360 MODE
================================== */

function enter360() {
  if (!video.src || !video.videoWidth) {
    alert('Сначала загрузите видео!');
    return;
  }

  vrActive = true;

  stage.classList.add('vr-mode');
  vrBtn.classList.add('active');

  controls.classList.add('active');

  updateCamera();
}

function exit360() {
  if (renderer.xr.isPresenting) return;

  vrActive = false;

  stage.classList.remove('vr-mode');
  vrBtn.classList.remove('active');
}

vrBtn.addEventListener('click', () => {
  if (vrActive) {
    exit360();
  } else {
    enter360();
  }
});

/* ==================================
   REAL WEBXR HEADSET
================================== */

webxrBtn.addEventListener('click', async () => {

  if (!video.src || !video.videoWidth) {
    alert('Сначала загрузите видео!');
    return;
  }

  if (!navigator.xr) {
    alert('WebXR не поддерживается этим браузером. Откройте страницу через HTTPS на совместимом VR-устройстве.');
    return;
  }

  try {
    const supported = await navigator.xr.isSessionSupported(
      'immersive-vr'
    );

    if (!supported) {
      alert('Совместимый VR-режим не найден.');
      return;
    }

    if (!vrActive) {
      enter360();
    }

    if (video.paused) {
      await video.play();
    }

    const session = await navigator.xr.requestSession(
      'immersive-vr',
      {
        optionalFeatures: [
          'local-floor',
          'bounded-floor'
        ]
      }
    );

    await renderer.xr.setSession(session);

    webxrBtn.classList.add('active');

    session.addEventListener('end', () => {
      webxrBtn.classList.remove('active');
    });

  } catch (error) {
    console.error('WebXR:', error);

    alert(
      'Не удалось запустить VR. Проверьте HTTPS, браузер и подключение шлема.'
    );
  }
});

/* ==================================
   FILE UPLOAD
================================== */

fileInput.addEventListener('change', async event => {
  const file = event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith('video/')) {
    alert('Выберите видеофайл!');
    fileInput.value = '';
    return;
  }

  if (renderer.xr.isPresenting) {
    await renderer.xr.getSession()?.end();
  }

  stopAmbient();

  video.pause();

  if (objectURL) {
    URL.revokeObjectURL(objectURL);
    objectURL = null;
  }

  objectURL = URL.createObjectURL(file);

  video.src = objectURL;
  video.load();

  fileName.textContent = file.name;

  video.currentTime = 0;

  seek.value = 0;
  updateProgress();

  video.loop = loopBtn.classList.contains('active');

  overlay.classList.remove('hidden');

  exit360();

  ambient.classList.remove('visible');

  stage.style.boxShadow = '0 35px 100px rgba(0,0,0,.8)';

  try {
    await video.play();
  } catch {
    // Автовоспроизведение может быть запрещено браузером.
    // Пользователь может нажать Play самостоятельно.
  }

  fileInput.value = '';
});

video.addEventListener('error', () => {
  if (video.error) {
    console.error('Video error:', video.error.message);
  }
});

/* ==================================
   KEYBOARD
================================== */

document.addEventListener('keydown', event => {
  if (
    ['INPUT', 'SELECT', 'TEXTAREA'].includes(
      document.activeElement.tagName
    )
  ) return;

  if (event.code === 'Space') {
    event.preventDefault();
    togglePlay();
  }

  if (event.code === 'ArrowLeft') {
    video.currentTime = Math.max(0, video.currentTime - 5);
  }

  if (event.code === 'ArrowRight') {
    if (Number.isFinite(video.duration)) {
      video.currentTime = Math.min(
        video.duration,
        video.currentTime + 5
      );
    }
  }

  if (event.key.toLowerCase() === 'l') {
    loopBtn.click();
  }

  if (event.key.toLowerCase() === 'f') {
    fullscreenBtn.click();
  }

  if (event.key.toLowerCase() === 'm') {
    video.muted = !video.muted;
  }
});

/* ==================================
   AUTO HIDE CONTROLS
================================== */

function showControls() {
  controls.classList.add('active');

  clearTimeout(hideTimer);

  if (!video.paused) {
    hideTimer = setTimeout(() => {
      controls.classList.remove('active');
    }, 3000);
  }
}

stage.addEventListener('mousemove', showControls);

stage.addEventListener('touchstart', showControls, {
  passive: true
});

stage.addEventListener('mouseleave', () => {
  if (!video.paused) {
    controls.classList.remove('active');
  }
});

controls.addEventListener('click', event => {
  event.stopPropagation();
});

/* ==================================
   CLEANUP
================================== */

window.addEventListener('beforeunload', () => {
  stopAmbient();

  clearTimeout(hideTimer);

  resizeObserver.disconnect();

  if (objectURL) {
    URL.revokeObjectURL(objectURL);
  }

  texture.dispose();
  material.dispose();
  geometry.dispose();
  renderer.dispose();
});

</script>

</body>
</html>
