<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>видеоплеер · ambient light</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px 20px;
      overflow: hidden;
      position: relative;
    }

    /* ---------- AMBIENT LIGHT (свечение от видео, как на YouTube) ---------- */
    .ambient-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    /* слой со свечением, который растягивается и размывается */
    .ambient-glow {
      position: absolute;
      inset: -20%;
      background-size: cover;
      background-position: center;
      filter: blur(120px) saturate(220%) brightness(0.85);
      opacity: 0;
      transform: scale(1.15);
      transition: opacity 0.8s ease;
      will-change: opacity, background-image;
    }

    /* затемняющая вуаль, чтобы свечение не было слишком ярким */
    .ambient-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0.1) 0%,
        rgba(0, 0, 0, 0.55) 60%,
        rgba(0, 0, 0, 0.92) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    /* ---------- ПЛЕЕР ---------- */
    .player-card {
      width: 100%;
      max-width: 1200px;
      position: relative;
      z-index: 2;
      transition: transform 0.3s ease;
    }

    .video-container {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: #0a0a0a;
      box-shadow:
        0 40px 80px -20px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      aspect-ratio: 16 / 9;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      outline: none;
    }

    /* ---------- КАСТОМНЫЕ КОНТРОЛЫ ---------- */
    .custom-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.6) 50%, transparent 100%);
      padding: 40px 20px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 10;
    }

    .video-container:hover .custom-controls,
    .custom-controls.active,
    .video-container:focus-within .custom-controls {
      opacity: 1;
      pointer-events: auto;
    }

    /* прогресс-бар */
    .progress-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .time-display {
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.3px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      opacity: 0.9;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .progress-slider-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      outline: none;
      cursor: pointer;
      transition: height 0.15s;
    }

    input[type="range"]:hover {
      height: 6px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #ff0000;
      border-radius: 50%;
      transition: transform 0.15s, box-shadow 0.15s;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.4);
      box-shadow: 0 0 14px rgba(255, 0, 0, 0.9);
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #ff0000;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    /* панель кнопок */
    .buttons-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .left-buttons, .right-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .icon-btn {
      background: transparent;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      transition: background 0.2s, transform 0.15s;
      outline: none;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      display: block;
    }

    /* большая кнопка play по центру */
    .center-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .center-play-overlay.visible {
      opacity: 1;
    }

    .center-play-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      border: 2px solid rgba(255, 255, 255, 0.25);
      transition: transform 0.2s, background 0.2s;
    }

    .center-play-btn:hover {
      background: rgba(255, 0, 0, 0.85);
      transform: scale(1.08);
    }

    .center-play-btn svg {
      width: 38px;
      height: 38px;
      fill: #fff;
      margin-left: 4px;
    }

    /* кнопка загрузки */
    .upload-label {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0 18px;
      height: 40px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 14px;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .upload-label:hover {
      background: #ff0000;
      border-color: #ff0000;
      transform: scale(1.03);
    }

    .upload-label svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    #fileInput {
      display: none;
    }

    .volume-slider-container {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
    }

    .volume-slider-container input {
      width: 70px;
      height: 4px;
    }

    .volume-slider-container input::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
    }

    /* имя файла */
    .file-info {
      font-size: 13px;
      color: #888;
      margin-top: 12px;
      padding-left: 4px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* скрываем нативные контролы */
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure {
      display: none !important;
    }

    /* мобильная адаптация */
    @media (max-width: 700px) {
      body { padding: 12px 8px; }
      .video-container { border-radius: 12px; }
      .custom-controls { padding: 30px 10px 8px 10px; gap: 6px; }
      .icon-btn { width: 34px; height: 34px; }
      .icon-btn svg { width: 18px; height: 18px; }
      .upload-label { padding: 0 12px; height: 34px; font-size: 12px; }
      .upload-label svg { width: 14px; height: 14px; }
      .time-display { font-size: 11px; }
      .volume-slider-container { display: none; }
      .center-play-btn { width: 60px; height: 60px; }
      .center-play-btn svg { width: 28px; height: 28px; }
      .ambient-glow { filter: blur(60px) saturate(200%); }
    }
  </style>
</head>
<body>

  <!-- ambient свечение позади плеера -->
  <div class="ambient-wrapper">
    <div class="ambient-glow" id="ambientGlow"></div>
    <div class="ambient-overlay"></div>
  </div>

  <!-- плеер -->
  <div class="player-card">
    <div class="video-container" id="videoContainer">
      <video id="video" preload="metadata" playsinline crossorigin="anonymous"></video>

      <!-- большая кнопка play по центру -->
      <div class="center-play-overlay visible" id="centerPlayOverlay">
        <div class="center-play-btn" id="centerPlayBtn">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>

      <!-- контролы -->
      <div class="custom-controls" id="customControls">
        <div class="progress-area">
          <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
          <div class="progress-slider-container">
            <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.01">
          </div>
        </div>

        <div class="buttons-panel">
          <div class="left-buttons">
            <button class="icon-btn" id="playPauseBtn" title="play/pause">
              <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="icon-btn" id="rewindBtn" title="назад 5 сек">
              <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
            </button>
            <button class="icon-btn" id="forwardBtn" title="вперёд 5 сек">
              <svg viewBox="0 0 24 24"><path d="M13 6v12l8.5-6-8.5-6zM4 18l8.5-6L4 6v12z"/></svg>
            </button>
            <div class="volume-slider-container">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="#fff" style="opacity:0.85;">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
              <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
            </div>
          </div>

          <div class="right-buttons">
            <button class="icon-btn" id="fullscreenBtn" title="полный экран">
              <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
            <label for="fileInput" class="upload-label">
              <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
              загрузить
            </label>
            <input type="file" id="fileInput" accept="video/*">
          </div>
        </div>
      </div>
    </div>

    <div class="file-info" id="fileInfo">
      <span>файл не выбран</span>
    </div>
  </div>

  <script>
    (function() {
      const video = document.getElementById('video');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      const seekSlider = document.getElementById('seekSlider');
      const timeDisplay = document.getElementById('timeDisplay');
      const fileInput = document.getElementById('fileInput');
      const fileInfoSpan = document.querySelector('#fileInfo span');
      const rewindBtn = document.getElementById('rewindBtn');
      const forwardBtn = document.getElementById('forwardBtn');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const volumeSlider = document.getElementById('volumeSlider');
      const customControls = document.getElementById('customControls');
      const videoContainer = document.getElementById('videoContainer');
      const ambientGlow = document.getElementById('ambientGlow');
      const centerPlayOverlay = document.getElementById('centerPlayOverlay');
      const centerPlayBtn = document.getElementById('centerPlayBtn');

      // ---------- форматы времени ----------
      function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return '0:00';
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        return `${m}:${s.toString().padStart(2,'0')}`;
      }

      function updateProgress() {
        if (!video.duration || isNaN(video.duration)) {
          timeDisplay.textContent = '0:00 / 0:00';
          seekSlider.value = 0;
          return;
        }
        const percent = (video.currentTime / video.duration) * 100;
        seekSlider.value = percent;
        timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
      }

      seekSlider.addEventListener('input', (e) => {
        const percent = parseFloat(e.target.value);
        if (video.duration && !isNaN(video.duration)) {
          video.currentTime = (percent / 100) * video.duration;
        }
      });

      video.addEventListener('timeupdate', updateProgress);
      video.addEventListener('loadedmetadata', updateProgress);
      video.addEventListener('durationchange', updateProgress);
      video.addEventListener('seeked', updateProgress);

      // ---------- play/pause ----------
      function togglePlayPause() {
        if (video.paused) video.play().catch(()=>{});
        else video.pause();
      }

      playPauseBtn.addEventListener('click', togglePlayPause);
      centerPlayBtn.addEventListener('click', togglePlayPause);

      video.addEventListener('play', () => {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        centerPlayOverlay.classList.remove('visible');
      });

      video.addEventListener('pause', () => {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        if (video.src) centerPlayOverlay.classList.add('visible');
      });

      // ---------- перемотка ----------
      rewindBtn.addEventListener('click', () => {
        video.currentTime = Math.max(0, video.currentTime - 5);
      });
      forwardBtn.addEventListener('click', () => {
        if (video.duration) video.currentTime = Math.min(video.duration, video.currentTime + 5);
      });

      // ---------- fullscreen ----------
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          const el = videoContainer;
          (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
      });

      // ---------- громкость ----------
      volumeSlider.addEventListener('input', (e) => {
        video.volume = parseFloat(e.target.value);
        video.muted = (video.volume === 0);
      });

      // ---------- AMBIENT LIGHT (YouTube-стиль) ----------
      const ambientCanvas = document.createElement('canvas');
      const ambientCtx = ambientCanvas.getContext('2d', { willReadFrequently: true });
      let ambientInterval = null;
      let lastGlowUpdate = 0;

      function updateAmbientLight() {
        if (!video.videoWidth || !video.videoHeight) return;
        if (video.paused && video.currentTime === 0) return;

        // уменьшенная копия кадра для анализа
        ambientCanvas.width = 32;
        ambientCanvas.height = 18;

        try {
          // рисуем кадр видео на канвасе
          ambientCtx.drawImage(video, 0, 0, ambientCanvas.width, ambientCanvas.height);

          // берём средний цвет через downscale
          const imageData = ambientCtx.getImageData(0, 0, ambientCanvas.width, ambientCanvas.height);
          const data = imageData.data;

          let r = 0, g = 0, b = 0;
          const count = data.length / 4;
          // берём не все пиксели, для скорости — каждый 4-й
          let sampled = 0;
          for (let i = 0; i < data.length; i += 16) { // шаг 4 пикселя
            r += data[i];
            g += data[i+1];
            b += data[i+2];
            sampled++;
          }
          r = Math.round(r / sampled);
          g = Math.round(g / sampled);
          b = Math.round(b / sampled);

          // немного усиливаем насыщенность
          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const satBoost = 1.4;
          if (max > 0) {
            r = Math.min(255, Math.round((r - min) * satBoost + min));
            g = Math.min(255, Math.round((g - min) * satBoost + min));
            b = Math.min(255, Math.round((b - min) * satBoost + min));
          }

          // устанавливаем цвет свечения (радиальное свечение + сам цвет)
          ambientGlow.style.background = `radial-gradient(ellipse at center, rgb(${r},${g},${b}) 0%, rgba(${r},${g},${b},0.4) 40%, transparent 75%)`;
          ambientGlow.style.opacity = '0.85';

          // также создаём псевдо-свечение по краям через box-shadow? 
          // лучше сделаем через фон самого контейнера
          videoContainer.style.boxShadow = `0 40px 80px -20px rgba(${r},${g},${b},0.4), 0 0 0 1px rgba(255,255,255,0.05)`;
        } catch(e) {
          // CORS или другая ошибка — просто пропускаем
        }
      }

      // запуск/остановка анализа в зависимости от состояния
      function startAmbientLoop() {
        if (ambientInterval) return;
        ambientInterval = setInterval(updateAmbientLight, 200); // каждые 200мс
      }

      function stopAmbientLoop() {
        if (ambientInterval) {
          clearInterval(ambientInterval);
          ambientInterval = null;
        }
      }

      video.addEventListener('play', startAmbientLoop);
      video.addEventListener('pause', () => {
        // оставляем последнее свечение, но перестаём обновлять
        stopAmbientLoop();
      });

      video.addEventListener('loadeddata', () => {
        if (!video.paused) startAmbientLoop();
      });

      // при перемотке обновляем цвет сразу
      video.addEventListener('seeked', () => {
        if (!video.paused) {
          updateAmbientLight();
        }
      });

      // сброс свечения при загрузке нового видео
      video.addEventListener('loadstart', () => {
        ambientGlow.style.opacity = '0';
        videoContainer.style.boxShadow = '0 40px 80px -20px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.05)';
      });

      // ---------- загрузка файла ----------
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('video/')) {
          alert('Выберите видеофайл');
          fileInput.value = '';
          return;
        }

        // освобождаем старый URL
        if (video.src && video.src.startsWith('blob:')) {
          URL.revokeObjectURL(video.src);
        }

        const url = URL.createObjectURL(file);
        video.src = url;
        video.load();

        const name = file.name.length > 40 ? file.name.slice(0, 37) + '…' : file.name;
        fileInfoSpan.textContent = name;

        seekSlider.value = 0;
        timeDisplay.textContent = '0:00 / 0:00';
        centerPlayOverlay.classList.add('visible');
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';

        // просим ambient обновиться после загрузки метаданных
        video.addEventListener('loadeddata', function onLoaded() {
          if (!video.paused) startAmbientLoop();
          video.removeEventListener('loadeddata', onLoaded);
        });
      });

      // ---------- клики по видео ----------
      video.addEventListener('click', togglePlayPause);

      // на мобильных показываем контролы после тапа
      videoContainer.addEventListener('touchstart', () => {
        customControls.classList.add('active');
        clearTimeout(videoContainer._touchTimer);
        videoContainer._touchTimer = setTimeout(() => {
          if (video.paused) return;
          customControls.classList.remove('active');
        }, 3000);
      }, { passive: true });

      // скрытие контролов при бездействии (для десктопа)
      let hideTimer;
      videoContainer.addEventListener('mousemove', () => {
        customControls.classList.add('active');
        clearTimeout(hideTimer);
        if (!video.paused) {
          hideTimer = setTimeout(() => customControls.classList.remove('active'), 2500);
        }
      });

      videoContainer.addEventListener('mouseleave', () => {
        if (!video.paused) customControls.classList.remove('active');
      });

      // остановка клика внутри контролов
      customControls.addEventListener('click', (e) => e.stopPropagation());

      // начальные иконки
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';

      // очистка при уходе со страницы
      window.addEventListener('beforeunload', () => {
        if (video.src && video.src.startsWith('blob:')) URL.revokeObjectURL(video.src);
        stopAmbientLoop();
      });
    })();
  </script>
</body>
</html>
