<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>стильный видеоплеер · загрузка и просмотр</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: linear-gradient(145deg, #0b0f15 0%, #1a1f2b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }

    /* главная карточка плеера */
    .player-card {
      width: 100%;
      max-width: 1100px;
      background: rgba(18, 22, 28, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 42px;
      padding: 24px;
      box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.7),
                  0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      transition: all 0.3s ease;
    }

    /* контейнер для видео и оверлеев */
    .video-container {
      position: relative;
      border-radius: 32px;
      overflow: hidden;
      background: #0a0c10;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      aspect-ratio: 16 / 9;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      transition: opacity 0.2s;
      outline: none;
    }

    /* кастомные контролы – плавные, стеклянные */
    .custom-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(5, 8, 12, 0.9) 0%, rgba(5, 8, 12, 0.5) 40%, transparent 100%);
      padding: 32px 20px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 10;
    }

    .video-container:hover .custom-controls,
    .custom-controls.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* прогресс-бар */
    .progress-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-display {
      font-size: 14px;
      font-weight: 500;
      color: #eef3fc;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.3px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      padding: 5px 12px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .progress-slider-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 2px 10px rgba(0, 180, 255, 0.7), 0 0 0 2px rgba(255, 255, 255, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
      border: none;
      cursor: grab;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 18px #3b9eff, 0 0 0 3px rgba(255, 255, 255, 0.8);
    }

    input[type="range"]::-webkit-slider-thumb:active {
      cursor: grabbing;
      transform: scale(1.1);
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      border: none;
      box-shadow: 0 2px 10px rgba(0, 180, 255, 0.7);
      cursor: pointer;
    }

    /* панель с кнопками */
    .buttons-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .left-buttons, .right-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #f0f5ff;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      font-size: 20px;
      outline: none;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.3);
      color: white;
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      display: block;
    }

    /* кнопка загрузки */
    .upload-label {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #2f6bff, #1e4bd2);
      border: none;
      padding: 0 24px;
      height: 48px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 15px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 10px 18px -6px #0b2a7a;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .upload-label:hover {
      background: linear-gradient(135deg, #3f7bff, #2a57e0);
      transform: scale(1.02);
      box-shadow: 0 14px 22px -8px #0f2f8a;
    }

    .upload-label:active {
      transform: scale(0.98);
    }

    .upload-label svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    #fileInput {
      display: none;
    }

    /* громкость – необязательный слайдер, скрыт для простоты, но можно добавить */
    .volume-slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 0 16px 0 10px;
      border-radius: 40px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .volume-slider-container input {
      width: 70px;
      height: 4px;
    }

    /* спрятанный нативный контрол */
    video::-webkit-media-controls {
      display: none !important;
    }

    video::-webkit-media-controls-enclosure {
      display: none !important;
    }

    /* индикация загрузки файла */
    .file-info {
      font-size: 14px;
      color: #aab9d4;
      margin-top: 16px;
      padding-left: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .file-info span {
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
    }

    /* адаптивность */
    @media (max-width: 700px) {
      .player-card {
        padding: 14px;
        border-radius: 28px;
      }
      .video-container {
        border-radius: 22px;
      }
      .custom-controls {
        padding: 24px 12px 12px 12px;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
        font-size: 18px;
      }
      .upload-label {
        padding: 0 16px;
        height: 42px;
        font-size: 13px;
      }
      .time-display {
        font-size: 12px;
        padding: 4px 8px;
      }
      .volume-slider-container {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="player-card">
    <div class="video-container" id="videoContainer">
      <!-- сам видеоэлемент -->
      <video id="video" preload="metadata" playsinline></video>

      <!-- кастомные контролы -->
      <div class="custom-controls" id="customControls">
        <div class="progress-area">
          <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
          <div class="progress-slider-container">
            <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.01">
          </div>
        </div>

        <div class="buttons-panel">
          <div class="left-buttons">
            <!-- play/pause -->
            <button class="icon-btn" id="playPauseBtn" title="воспроизвести/пауза">
              <svg id="playIcon" viewBox="0 0 24 24" width="24" height="24">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <svg id="pauseIcon" style="display: none;" viewBox="0 0 24 24" width="24" height="24">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>

            <!-- перемотка на 5 сек назад -->
            <button class="icon-btn" id="rewindBtn" title="назад 5 секунд">
              <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/>
              </svg>
            </button>

            <!-- перемотка на 5 сек вперед -->
            <button class="icon-btn" id="forwardBtn" title="вперёд 5 секунд">
              <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M13 6v12l8.5-6-8.5-6zM4 18l8.5-6L4 6v12z"/>
              </svg>
            </button>

            <!-- громкость (дополнительно) -->
            <div class="volume-slider-container">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="color:#ccd9f0;">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
              <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
            </div>
          </div>

          <div class="right-buttons">
            <!-- полноэкранный режим -->
            <button class="icon-btn" id="fullscreenBtn" title="полный экран">
              <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
              </svg>
            </button>
            <!-- загрузка видео -->
            <label for="fileInput" class="upload-label">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
              </svg>
              загрузить видео
            </label>
            <input type="file" id="fileInput" accept="video/*">
          </div>
        </div>
      </div>
    </div>
    <!-- строчка с именем файла -->
    <div class="file-info" id="fileInfo">
      <span>📁 файл не выбран</span>
    </div>
  </div>

  <script>
    (function() {
      const video = document.getElementById('video');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      const seekSlider = document.getElementById('seekSlider');
      const timeDisplay = document.getElementById('timeDisplay');
      const fileInput = document.getElementById('fileInput');
      const fileInfoSpan = document.querySelector('#fileInfo span');
      const rewindBtn = document.getElementById('rewindBtn');
      const forwardBtn = document.getElementById('forwardBtn');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const volumeSlider = document.getElementById('volumeSlider');
      const customControls = document.getElementById('customControls');
      const videoContainer = document.getElementById('videoContainer');

      // форматирование времени
      function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return '00:00';
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) {
          return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }

      // обновление слайдера и времени
      function updateProgress() {
        if (!video.duration || isNaN(video.duration)) {
          timeDisplay.textContent = '00:00 / 00:00';
          seekSlider.value = 0;
          return;
        }
        const percent = (video.currentTime / video.duration) * 100;
        seekSlider.value = percent;
        const currentFormatted = formatTime(video.currentTime);
        const totalFormatted = formatTime(video.duration);
        timeDisplay.textContent = `${currentFormatted} / ${totalFormatted}`;
      }

      // перемотка по слайдеру
      seekSlider.addEventListener('input', function(e) {
        const percent = parseFloat(e.target.value);
        if (video.duration && !isNaN(video.duration)) {
          video.currentTime = (percent / 100) * video.duration;
        }
      });

      // обновляем прогресс при воспроизведении / загрузке / перемотке
      video.addEventListener('timeupdate', updateProgress);
      video.addEventListener('loadedmetadata', updateProgress);
      video.addEventListener('durationchange', updateProgress);
      video.addEventListener('seeked', updateProgress);

      // play / pause кнопка
      function togglePlayPause() {
        if (video.paused) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      }

      playPauseBtn.addEventListener('click', togglePlayPause);

      // синхронизация иконок play/pause
      video.addEventListener('play', () => {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      });
      video.addEventListener('pause', () => {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      });

      // перемотка на 5 секунд
      rewindBtn.addEventListener('click', () => {
        video.currentTime = Math.max(0, video.currentTime - 5);
      });

      forwardBtn.addEventListener('click', () => {
        if (video.duration) {
          video.currentTime = Math.min(video.duration, video.currentTime + 5);
        }
      });

      // полноэкранный режим
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          if (videoContainer.requestFullscreen) {
            videoContainer.requestFullscreen();
          } else if (videoContainer.webkitRequestFullscreen) {
            videoContainer.webkitRequestFullscreen();
          } else if (videoContainer.msRequestFullscreen) {
            videoContainer.msRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      });

      // громкость
      volumeSlider.addEventListener('input', (e) => {
        video.volume = parseFloat(e.target.value);
        if (video.volume === 0) {
          video.muted = true;
        } else {
          video.muted = false;
        }
      });

      // загрузка видео
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // проверка типа
        if (!file.type.startsWith('video/')) {
          alert('Пожалуйста, выберите видеофайл');
          fileInput.value = '';
          return;
        }

        const fileURL = URL.createObjectURL(file);
        video.src = fileURL;
        video.load();

        // показываем имя файла
        const fileName = file.name.length > 38 ? file.name.slice(0, 35) + '...' : file.name;
        fileInfoSpan.innerHTML = `🎬 ${fileName}`;

        // сброс слайдера и времени
        seekSlider.value = 0;
        timeDisplay.textContent = '00:00 / 00:00';

        // после загрузки метаданных обновим
        video.addEventListener('loadedmetadata', function onMeta() {
          updateProgress();
          // автозапуск не делаем, чтобы не раздражать
          video.removeEventListener('loadedmetadata', onMeta);
        }, { once: true });

        // очищаем старый URL при закрытии страницы (опционально)
        window.addEventListener('beforeunload', () => {
          URL.revokeObjectURL(fileURL);
        }, { once: true });
      });

      // клик по видео – play/pause (как в ютубе)
      video.addEventListener('click', togglePlayPause);

      // если видео нет – показываем заглушку
      video.addEventListener('error', () => {
        if (video.src) {
          fileInfoSpan.innerHTML = '⚠️ ошибка загрузки видео';
        }
      });

      // показываем контролы при инициализации, но лучше – по ховеру (уже есть)
      // для тач-устройств: при клике на контейнер делать контролы видимыми
      videoContainer.addEventListener('click', (e) => {
        if (e.target === videoContainer || e.target === video) {
          customControls.classList.add('active');
          // и убираем через 2 секунды бездействия? 
          // но лучше полагаться на ховер, а на тач – добавляем временный класс
        }
      });

      // маленький хак: на мобильных устройствах убираем active через 3 секунды
      videoContainer.addEventListener('touchstart', () => {
        customControls.classList.add('active');
      }, { passive: true });

      // если слайдер трогают, не скрываем контролы
      seekSlider.addEventListener('mousedown', (e) => e.stopPropagation());
      volumeSlider.addEventListener('mousedown', (e) => e.stopPropagation());

      // Также сделаем так, чтобы при наведении на контролы они не исчезали
      customControls.addEventListener('mouseenter', () => {
        customControls.style.opacity = '1';
        customControls.style.pointerEvents = 'auto';
      });

      // предотвращаем скрытие при клике на контролы
      customControls.addEventListener('click', (e) => e.stopPropagation());

      // Инициализация иконки play
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';

      // обнуляем URL при перезагрузке – не обязательно, но чисто
      window.addEventListener('beforeunload', () => {
        if (video.src) {
          URL.revokeObjectURL(video.src);
        }
      });
    })();
  </script>
</body>
</html>
